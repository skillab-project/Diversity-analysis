version: '3.8'

services:
  skillab-analysis:
    container_name: ${APP_NAME}
    image: ${DOCKER_REG}${DOCKER_REPO}${APP_NAME}:${DOCKER_TAG}
    build: .
    environment:
      - URL=https://skillab-tracker.csd.auth.gr/api
    ports:
      - "8870:8870"    
    volumes:
      - diversity_data:/app/data
    labels:
      io.portainer.accesscontrol.teams: skillab-all
    restart: unless-stopped
    
volumes:
  diversity_data: